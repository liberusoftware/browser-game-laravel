openapi: 3.1.0
info:
  title: Browser Game Live Ops API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.test
    description: Application API host
paths:
  /api/v1/browser-game/live-ops:
    get:
      operationId: browser.game.live-ops.list
      summary: List authorized browser-game live ops
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/ResourceCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/browser-game/live-ops/{id}:
    get:
      operationId: browser.game.live-ops.get
      summary: Retrieve an authorized browser-game live ops record
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/browser-game/live-ops/{liveOps}/publish:
    post:
      operationId: browser.game.live_ops.publish
      summary: Publish a Live Ops record
      security: [{ sanctum: [] }]
      parameters: [{ name: liveOps, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/browser-game/live-ops/{liveOps}/claim:
    post:
      operationId: browser.game.live_ops.claim
      summary: Claim a published activity or grant
      security: [{ sanctum: [] }]
      parameters: [{ name: liveOps, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { claim_key: { type: string } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/browser-game/live-ops/daily/{liveOps}/status:
    get:
      operationId: browser.game.live_ops.daily.status
      summary: Read the authenticated player's daily activity streak
      security: [{ sanctum: [] }]
      parameters: [{ name: liveOps, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/DailyStatus' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/browser-game/live-ops/daily/{liveOps}/claim:
    post:
      operationId: browser.game.live_ops.daily.claim
      summary: Claim the published daily activity once for the current calendar day
      security: [{ sanctum: [] }]
      parameters: [{ name: liveOps, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { timezone: { type: string } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/live-ops/{liveOps}/rollback:
    post:
      operationId: browser.game.live_ops.rollback
      summary: Roll back a Live Ops version with evidence
      security: [{ sanctum: [] }]
      parameters: [{ name: liveOps, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 1000 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Opaque resource identifier.
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    Resource:
      type: object
      required: [id, type, attributes]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: browser-game-live-ops
        attributes:
          type: object
          additionalProperties: true
    ResourceCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Resource:
      description: Authorized live ops resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Resource'
    ResourceCollection:
      description: Authorized paginated live ops resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceCollection'
    DailyStatus:
      description: Current daily activity claim state.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [claim_key, claimed, streak, grant]
                properties:
                  claim_key: { type: string, format: date }
                  claimed: { type: boolean }
                  streak: { type: integer, minimum: 1 }
                  grant: { type: object, additionalProperties: true }
    ValidationError:
      description: The request failed validation or the activity is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource is unavailable in the current authorization context.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: The request rate limit was exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

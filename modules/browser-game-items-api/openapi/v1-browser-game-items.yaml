openapi: 3.1.0
info:
  title: Browser Game Items API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.test
    description: Application API host
paths:
  /api/v1/browser-game/items:
    get:
      operationId: browser.game.items.list
      summary: List authorized browser-game items
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/ResourceCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/browser-game/items/{id}:
    get:
      operationId: browser.game.items.get
      summary: Retrieve an authorized browser-game items record
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/browser-game/items/inventory/me:
    get:
      operationId: browser.game.items.inventory
      summary: Retrieve the authenticated actor inventory
      security: [{ sanctum: [] }]
      responses:
        '200': { $ref: '#/components/responses/ResourceCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/browser-game/items/inventory/{item}/add:
    post:
      operationId: browser.game.items.inventory.add
      summary: Add an item to the authenticated inventory
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryMutation' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/items/inventory/{item}/remove:
    post:
      operationId: browser.game.items.inventory.remove
      summary: Remove an item from the authenticated inventory
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryMutation' } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/items/inventory/entries/{id}/equip:
    post:
      operationId: browser.game.items.inventory.equip
      summary: Equip an inventory entry
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/items/inventory/entries/{id}/unequip:
    post:
      operationId: browser.game.items.inventory.unequip
      summary: Unequip an inventory entry
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/browser-game/items/inventory/entries/{id}/bind:
    post:
      operationId: browser.game.items.inventory.bind
      summary: Bind an inventory entry to its actor
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/browser-game/items/inventory/entries/{id}/durability:
    post:
      operationId: browser.game.items.inventory.durability
      summary: Adjust inventory entry durability
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [delta], properties: { delta: { type: integer } } } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Opaque resource identifier.
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    InventoryMutation:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
        metadata: { type: object, additionalProperties: true }
    Resource:
      type: object
      required: [id, type, attributes]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: browser-game-items
        attributes:
          type: object
          additionalProperties: true
    ResourceCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Resource:
      description: Authorized items resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Resource'
    ResourceCollection:
      description: Authorized paginated items resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceCollection'
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource is unavailable in the current authorization context.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: The request rate limit was exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

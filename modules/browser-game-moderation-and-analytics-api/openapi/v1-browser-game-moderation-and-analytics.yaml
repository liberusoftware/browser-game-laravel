openapi: 3.1.0
info:
  title: Browser Game Moderation and Analytics API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.test
    description: Application API host
paths:
  /api/v1/browser-game/moderation-and-analytics:
    get:
      operationId: browser.game.moderation-and-analytics.list
      summary: List authorized browser-game moderation and analytics
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/ResourceCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/browser-game/moderation-and-analytics/reports:
    post:
      operationId: browser.game.moderation-and-analytics.reports.create
      summary: Submit a moderation report
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/sanctions:
    post:
      operationId: browser.game.moderation-and-analytics.sanctions.create
      summary: Issue a sanction record
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/appeals:
    post:
      operationId: browser.game.moderation-and-analytics.appeals.create
      summary: Submit an appeal
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/telemetry:
    post:
      operationId: browser.game.moderation-and-analytics.telemetry.create
      summary: Record telemetry
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/funnels:
    post:
      operationId: browser.game.moderation-and-analytics.funnels.create
      summary: Record a funnel event
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/balance:
    post:
      operationId: browser.game.moderation-and-analytics.balance.create
      summary: Record balance analytics
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/economy:
    post:
      operationId: browser.game.moderation-and-analytics.economy.create
      summary: Record economy analytics
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/fraud:
    post:
      operationId: browser.game.moderation-and-analytics.fraud.create
      summary: Record a fraud signal
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/health:
    post:
      operationId: browser.game.moderation-and-analytics.health.create
      summary: Record a health signal
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TypedRecordRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/moderation-and-analytics/{id}:
    get:
      operationId: browser.game.moderation-and-analytics.get
      summary: Retrieve an authorized browser-game moderation record
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Opaque resource identifier.
      schema:
        type: string
        format: uuid
    PageSize:
      name: page[size]
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    TypedRecordRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        target_id: { type: string }
        data: { type: object, additionalProperties: true }
        idempotency_key: { type: string, maxLength: 128 }
    Resource:
      type: object
      required: [id, type, attributes]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: browser-game-moderation-and-analytics
        attributes:
          type: object
          additionalProperties: true
    ResourceCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Resource:
      description: Authorized moderation and analytics resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Resource'
    ResourceCollection:
      description: Authorized paginated moderation and analytics resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceCollection'
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource is unavailable in the current authorization context.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: The request rate limit was exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

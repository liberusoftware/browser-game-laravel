openapi: 3.1.0
info:
  title: Browser Game Game Core API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.test
paths:
  /api/v1/browser-game/game-core:
    get:
      operationId: browser.game.game.core.list
      summary: List authorized game worlds
      security: [{ sanctum: [] }]
      parameters: [{ name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }]
      responses:
        '200': { description: Authorized world collection }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: browser.game.game.core.create
      summary: Create a game world
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorldRequest' } } }
      responses:
        '201': { description: World created }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/browser-game/game-core/{world}:
    get:
      operationId: browser.game.game.core.get
      summary: Retrieve an authorized world overview
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      responses:
        '200': { description: Authorized world overview }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: browser.game.game.core.update
      summary: Update an authorized game world
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorldUpdateRequest' } } }
      responses:
        '200': { description: World updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/browser-game/game-core/{world}/clock:
    put:
      operationId: browser.game.game.core.clock
      summary: Set the authoritative game clock
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current_at, speed], properties: { current_at: { type: string, format: date-time }, speed: { type: number, minimum: 0 }, paused: { type: boolean } } } } } }
      responses: { '200': { description: Clock updated }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/game-core/{world}/rulesets:
    post:
      operationId: browser.game.game.core.ruleset
      summary: Publish a ruleset version
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version, rules], properties: { version: { type: integer, minimum: 1 }, rules: { type: object, additionalProperties: true } } } } } }
      responses: { '201': { description: Ruleset published }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/game-core/{world}/content-versions:
    post:
      operationId: browser.game.game.core.content
      summary: Publish a content version
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version, content_hash, manifest], properties: { version: { type: integer, minimum: 1 }, content_hash: { type: string }, manifest: { type: object, additionalProperties: true } } } } } }
      responses: { '201': { description: Content version published }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/game-core/{world}/feature-flags/{key}:
    put:
      operationId: browser.game.game.core.feature.flag
      summary: Change a feature flag
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }, { name: key, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, rollout_percentage: { type: integer, minimum: 0, maximum: 100 }, constraints: { type: object, additionalProperties: true } } } } } }
      responses: { '200': { description: Feature flag updated }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/game-core/{world}/maintenance:
    put:
      operationId: browser.game.game.core.maintenance
      summary: Change maintenance state
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [scheduled, active, resolved] }, message: { type: string } } } } } }
      responses: { '200': { description: Maintenance state updated }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum }
  parameters:
    WorldId: { name: world, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    WorldRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        metadata: { type: object, additionalProperties: true }
    WorldUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/WorldRequest'
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [draft, active, archived] }
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
  responses:
    Unauthorized:
      description: Authentication is required.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource unavailable in the current authorization context.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationError:
      description: Request validation failed.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Request rate limit exceeded.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

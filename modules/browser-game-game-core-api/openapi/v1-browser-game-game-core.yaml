openapi: 3.1.0
info:
  title: Browser Game Game Core API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.test
paths:
  /api/v1/browser-game/game-core:
    get:
      operationId: browser.game.game.core.list
      summary: List authorized game worlds
      security: [{ sanctum: [] }]
      parameters: [{ name: "page[size]", in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }]
      responses:
        '200': { $ref: '#/components/responses/WorldCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: browser.game.game.core.create
      summary: Create a game world
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorldRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/browser-game/game-core/{world}:
    get:
      operationId: browser.game.game.core.get
      summary: Retrieve an authorized world overview
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      responses:
        '200': { $ref: '#/components/responses/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: browser.game.game.core.update
      summary: Update an authorized game world
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorldUpdateRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/browser-game/game-core/{world}/clock:
    put:
      operationId: browser.game.game.core.clock
      summary: Set the authoritative game clock
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current_at, speed], properties: { current_at: { type: string, format: date-time }, speed: { type: number, minimum: 0 }, paused: { type: boolean } } } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/game-core/{world}/rulesets:
    post:
      operationId: browser.game.game.core.ruleset
      summary: Publish a ruleset version
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version, rules], properties: { version: { type: integer, minimum: 1 }, rules: { type: object, additionalProperties: true } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/game-core/{world}/content-versions:
    post:
      operationId: browser.game.game.core.content
      summary: Publish a content version
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version, content_hash, manifest], properties: { version: { type: integer, minimum: 1 }, content_hash: { type: string }, manifest: { type: object, additionalProperties: true } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/game-core/{world}/feature-flags/{key}:
    get:
      operationId: browser.game.game.core.feature.flag.evaluate
      summary: Evaluate a feature flag for the authenticated actor
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }, { name: key, in: path, required: true, schema: { type: string } }, { name: attributes, in: query, schema: { type: object, additionalProperties: true } }]
      responses: { '200': { $ref: '#/components/responses/FeatureEvaluation' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
    put:
      operationId: browser.game.game.core.feature.flag
      summary: Change a feature flag
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }, { name: key, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, rollout_percentage: { type: integer, minimum: 0, maximum: 100 }, constraints: { type: object, additionalProperties: true } } } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/browser-game/game-core/{world}/maintenance:
    put:
      operationId: browser.game.game.core.maintenance
      summary: Change maintenance state
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/WorldId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [scheduled, active, resolved] }, message: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum }
  parameters:
    WorldId: { name: world, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    WorldRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        metadata: { type: object, additionalProperties: true }
    WorldUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/WorldRequest'
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [draft, active, archived] }
    Resource:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/WorldResource'
            - $ref: '#/components/schemas/ClockResource'
            - $ref: '#/components/schemas/RulesetResource'
            - $ref: '#/components/schemas/ContentResource'
            - $ref: '#/components/schemas/FeatureFlagResource'
            - $ref: '#/components/schemas/MaintenanceResource'
    WorldCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WorldResource' }
        links: { type: object, additionalProperties: true }
        meta: { type: object, additionalProperties: true }
    WorldResource:
      type: object
      required: [id, type, attributes]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: browser-game-game-core }
        attributes:
          type: object
          required: [name, slug, status, metadata]
          properties:
            name: { type: string }
            slug: { type: string }
            status: { type: string, enum: [draft, active, archived] }
            metadata: { type: object, additionalProperties: true }
            overview: { type: object, nullable: true, additionalProperties: true }
            created_at: { type: string, format: date-time, nullable: true }
            updated_at: { type: string, format: date-time, nullable: true }
    ClockResource:
      allOf:
        - $ref: '#/components/schemas/ResourceObject'
        - type: object
          properties:
            type: { type: string, const: browser-game-game-clock }
    RulesetResource:
      allOf:
        - $ref: '#/components/schemas/ResourceObject'
        - type: object
          properties:
            type: { type: string, const: browser-game-game-ruleset }
    ContentResource:
      allOf:
        - $ref: '#/components/schemas/ResourceObject'
        - type: object
          properties:
            type: { type: string, const: browser-game-game-content-version }
    FeatureFlagResource:
      allOf:
        - $ref: '#/components/schemas/ResourceObject'
        - type: object
          properties:
            type: { type: string, const: browser-game-game-feature-flag }
    MaintenanceResource:
      allOf:
        - $ref: '#/components/schemas/ResourceObject'
        - type: object
          properties:
            type: { type: string, const: browser-game-game-maintenance-state }
    ResourceObject:
      type: object
      required: [id, type, attributes]
      properties:
        id: { type: string }
        type: { type: string }
        attributes: { type: object, additionalProperties: true }
    FeatureEvaluation:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type: { type: string, const: browser-game-game-feature-evaluation }
            attributes:
              type: object
              required: [world_id, key, enabled]
              properties:
                world_id: { type: string, format: uuid }
                key: { type: string }
                enabled: { type: boolean }
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
  responses:
    Resource:
      description: A single authorized Game Core resource.
      content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } }
    WorldCollection:
      description: A paginated collection of authorized worlds.
      content: { application/json: { schema: { $ref: '#/components/schemas/WorldCollection' } } }
    FeatureEvaluation:
      description: Deterministic feature evaluation for the authenticated actor.
      content: { application/json: { schema: { $ref: '#/components/schemas/FeatureEvaluation' } } }
    Unauthorized:
      description: Authentication is required.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource unavailable in the current authorization context.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationError:
      description: Request validation failed.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Request rate limit exceeded.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

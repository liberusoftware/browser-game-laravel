openapi: 3.1.0
info: {title: Browser Game World API, version: 1.0.0}
paths:
  /api/v1/browser-game/world:
    get:
      operationId: browser.game.world.list
      security: [{sanctum: []}]
      parameters: [{name: kind, in: query, schema: {type: string}}, {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}]
      responses: {'200': {description: Authorized world catalog}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}

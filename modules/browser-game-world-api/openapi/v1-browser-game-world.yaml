openapi: 3.1.0
info:
  title: Browser Game World API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.test
paths:
  /api/v1/browser-game/world:
    get:
      operationId: browser.game.world.list
      summary: List authorized world entities
      security: [{ sanctum: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string } }
        - { name: page[size], in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Authorized world catalog }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: browser.game.world.create
      summary: Define a world entity
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, slug]
              properties:
                kind: { type: string, example: location }
                name: { type: string, maxLength: 255 }
                slug: { type: string, maxLength: 120 }
                world_id: { type: string, format: uuid, nullable: true }
                attributes: { type: object, additionalProperties: true }
                unlock_key: { type: string, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/browser-game/world/{entity}:
    get:
      operationId: browser.game.world.get
      summary: Retrieve an authorized world entity
      security: [{ sanctum: [] }]
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Entity not found in the current context. }
    patch:
      operationId: browser.game.world.update
      summary: Update an authorized world entity
      security: [{ sanctum: [] }]
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, status]
              properties:
                name: { type: string, maxLength: 255 }
                slug: { type: string, maxLength: 120 }
                status: { type: string, enum: [active, hidden, archived] }
                attributes: { type: object, additionalProperties: true }
                coordinates: { type: array, items: { type: number }, nullable: true }
                unlock_key: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Entity not found in the current context. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/browser-game/world/travel:
    post:
      operationId: browser.game.world.travel
      summary: Record idempotent actor travel
      security: [{ sanctum: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [destination_id], properties: { origin_id: { type: string, format: uuid }, destination_id: { type: string, format: uuid }, idempotency_key: { type: string }, metadata: { type: object, additionalProperties: true } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum }
  schemas:
    BrowserGameWorldResource:
      type: object
      required: [id, type, attributes]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: browser-game-world }
        attributes:
          type: object
          required: [kind, name, slug, status]
          additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
  responses:
    Resource:
      description: A world resource.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/BrowserGameWorldResource' }
    ValidationError:
      description: Request validation failed.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Authentication is required.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Request rate limit exceeded.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

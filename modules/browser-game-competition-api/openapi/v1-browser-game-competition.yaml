openapi: 3.1.0
info:
  title: Browser Game Competition API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.test
    description: Application API host
paths:
  /api/v1/browser-game/competition:
    get:
      operationId: browser.game.competition.list
      summary: List authorized browser-game competition
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/ResourceCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/browser-game/competition/{id}:
    get:
      operationId: browser.game.competition.get
      summary: Retrieve an authorized browser-game competition record
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/browser-game/competition/{competition}/queue:
    post:
      operationId: browser.game.competition.queue
      summary: Enter the authenticated player into matchmaking
      security: [{ sanctum: [] }]
      parameters: [{ name: competition, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/browser-game/competition/{competition}/matches:
    post:
      operationId: browser.game.competition.match
      summary: Create an anti-collusion tracked competition match
      security: [{ sanctum: [] }]
      parameters: [{ name: competition, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [player_a, player_b], properties: { player_a: { type: string }, player_b: { type: string } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/browser-game/competition/{competition}/leaderboard:
    get:
      operationId: browser.game.competition.leaderboard
      summary: Read the authorized competition leaderboard
      security: [{ sanctum: [] }]
      parameters: [{ name: competition, in: path, required: true, schema: { type: string, format: uuid } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }]
      responses: { '200': { $ref: '#/components/responses/ResourceCollection' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/browser-game/competition/{competition}/rewards:
    get:
      operationId: browser.game.competition.rewards
      summary: List the authenticated player's competition rewards
      security: [{ sanctum: [] }]
      parameters: [{ name: competition, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/ResourceCollection' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/browser-game/competition/{competition}/flags:
    post:
      operationId: browser.game.competition.flag
      summary: Submit an anti-collusion flag
      security: [{ sanctum: [] }]
      parameters: [{ name: competition, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 1000 }, match_id: { type: string, format: uuid, nullable: true } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/Problem' } }
  /api/v1/browser-game/competition/rewards/{reward}/claim:
    post:
      operationId: browser.game.competition.reward.claim
      summary: Claim an owned competition reward
      security: [{ sanctum: [] }]
      parameters: [{ name: reward, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/browser-game/competition/matches/{match}/resolve:
    post:
      operationId: browser.game.competition.resolve
      summary: Resolve a competition match and update rankings
      security: [{ sanctum: [] }]
      parameters: [{ name: match, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [winner_id], properties: { winner_id: { type: string }, evidence: { type: object, additionalProperties: true } } } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Opaque resource identifier.
      schema:
        type: string
        format: uuid
    PageSize:
      name: page[size]
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    Resource:
      type: object
      required: [id, type, attributes]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: browser-game-competition
        attributes:
          type: object
          additionalProperties: true
    ResourceCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Resource:
      description: Authorized competition resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Resource'
    ResourceCollection:
      description: Authorized paginated competition resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceCollection'
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource is unavailable in the current authorization context.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: The request rate limit was exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
